services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?NEXT_PUBLIC_SUPABASE_URL is required}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY is required}

    image: detailforge:0.3.0

    restart: unless-stopped
    init: true
    ipc: host
    user: pwuser

    security_opt:
      - seccomp=./deploy/seccomp_profile.json
      - no-new-privileges=true

    env_file:
      - ${DETAILFORGE_ENV_FILE:-/etc/detailforge/detailforge.env}

    environment:
      NODE_ENV: production
      PORT: "3000"
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

    ports:
      - "127.0.0.1:3000:3000"

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health',{cache:'no-store'})
          .then(r=>process.exit(r.ok?0:1))
          .catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
